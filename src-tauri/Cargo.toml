[package]
name = "nexbox"
version = "9.0.0"
description = "NexBox - 为现代玩家打造的游戏工具箱"
authors = ["MuLiu_SaMa"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# 工作区：nx-dl-engine 为独立 crate（edition 2024，承载 FluxDown 搬运源码，
# 隔离其 let-chains 等新语法对主工程 edition 的影响）
[workspace]
members = ["nx-dl-engine"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "nexbox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
nx-dl-engine = { path = "nx-dl-engine" }
tokio-util = { version = "0.7", features = ["io"] }
filetime = "0.2"
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10", features = ["protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-store = "2"
tauri-plugin-http = "2"
tauri-plugin-os = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
wmi = "0.14"
thiserror = "2"
reqwest = { version = "0.11", features = ["stream", "json", "blocking"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.24"
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
dirs = "5.0"
nvml-wrapper = "0.10"
sysinfo = "0.30"
chrono = "0.4"
env_logger = "0.11"
regex = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
rfd = "0.15"
tauri-plugin-dialog = "2"
urlencoding = "2.1"
url = "2"
base64 = "0.22"
bytes = "1"
dashmap = "6"
parking_lot = "0.12"
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors", "trace"] }
async-stream = "0.3"
zip = "2"
tauri-plugin-opener = "2"
jpeg-encoder = { version = "0.6", features = ["simd"] }
tauri-plugin-clipboard-manager = "2"
btleplug = "0.12"
libloading = "0.8"
spin_sleep = "1.3"

# 网易云 EAPI 加密
md-5 = "0.10"
aes = "0.8"
cipher = "0.4"
cbc = { version = "0.1", features = ["block-padding", "alloc"] }
num-bigint = "0.4"
num-traits = "0.2"
hex = "0.4"

# QQ 音乐搜索签名
sha1 = "0.10"
encoding_rs = "0.8"

# 本地音频元数据解析（封面/标题/艺术家/时长）
lofty = "0.21"

# 存储清理/垃圾清理/大文件扫描
walkdir = "2"
jwalk = "0.8"
glob = "0.3"

# 启动项图标：从 exe 提取图标并编码为 PNG
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }

[target.'cfg(windows)'.dependencies]
mslnk = "0.1"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_GdiPlus",
    "Win32_UI_Accessibility",
    "Win32_UI_ColorSystem",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_Etw",
    "Win32_System_Time",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Services",
    "Win32_System_Registry",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Media_Multimedia",
    "Win32_Devices_Display",
] }
winreg = "0.52"
winapi = { version = "0.3", features = ["winuser", "windef", "shellapi", "handleapi", "processthreadsapi", "securitybaseapi", "winbase", "winnt", "sddl", "fileapi", "ioapiset", "errhandlingapi", "ntdef"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Accessibility",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_Devices_Properties",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Devices_Bluetooth_GenericAttributeProfile",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Media",
    "Media_Control",
    "Storage",
    "Storage_Streams",
    "Win32_System_WinRT",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Media",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Properties",
    "Win32_System_Services",
    "Win32_Storage",
    "Win32_Storage_FileSystem",
    "UI_UIAutomation",
    "UI_Notifications",
    "UI_Notifications_Management",
    "ApplicationModel",
    "implement",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectWrite",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_System_Power",
] }
