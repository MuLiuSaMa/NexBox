name: Build & Sign NexBox
on:
  push:
    branches: [ main ]
  workflow_dispatch: # 网页手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # tauri-cli 来自 devDependencies，必须走 npm 脚本；它会先执行
      # beforeBuildCommand（npm run build）再编译，产物按 productName 命名为 NexBox.exe
      - name: Build Tauri App
        run: npm run tauri:build

      # 直接上传单独exe，对应SignPath <pe-file>
      - name: Upload unsigned EXE artifact
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexbox-build
          path: src-tauri/target/release/nexbox.exe
          retention-days: 14

      - name: Submit Signing Request to SignPath
        id: sign-request
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: ./signed_output

      - name: Upload signed exe
        uses: actions/upload-artifact@v4
        with:
          name: nexbox-signed
          path: ./signed_output
